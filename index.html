const ds = (d) => Math.floor((Date.now()-new Date(d))/86400000);

const ScoreBadge = ({score}) => {
  const c = score>=80?"#10B981":score>=55?"#F59E0B":"#EF4444";
  const l = score>=80?"Hot":score>=55?"Warm":"Cold";
  return <span style={{display:"inline-flex",alignItems:"center",gap:4,background:c+"22",color:c,border:`1px solid ${c}44`,borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,fontFamily:"monospace"}}><span style={{width:6,height:6,borderRadius:"50%",background:c,display:"inline-block"}}/>{l} · {score}</span>;
};

const Sheet = ({children,onClose,title}) => (
  <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#0F1117",borderRadius:"20px 20px 0 0",width:"100%",maxHeight:"90vh",overflowY:"auto",padding:"0 0 40px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"20px 20px 16px",borderBottom:"1px solid #1A1D27",position:"sticky",top:0,background:"#0F1117",zIndex:1}}>
        <span style={{fontWeight:700,fontSize:16}}>{title}</span>
        <button onClick={onClose} style={{background:"#1A1D27",border:"none",color:"#9CA3AF",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
      </div>
      <div style={{padding:"20px"}}>{children}</div>
    </div>
  </div>
);

const inp = {background:"#1A1D27",border:"1px solid #2A2D3A",borderRadius:10,color:"#E8EAF0",padding:"12px 14px",fontSize:14,width:"100%",outline:"none",fontFamily:"system-ui",boxSizing:"border-box",WebkitAppearance:"none"};
const lbl = {fontSize:11,color:"#6B7280",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:6,display:"block"};

function App() {
  const [leads, setLeads] = useState(() => {
    try {
      const saved = localStorage.getItem("valordek_leads");
      return saved ? JSON.parse(saved) : SAMPLE_LEADS;
    } catch { return SAMPLE_LEADS; }
  });
  const [nextIdInit] = useState(() => {
    try {
      const saved = localStorage.getItem("valordek_leads");
      if (saved) {
        const parsed = JSON.parse(saved);
        return parsed.length > 0 ? Math.max(...parsed.map(l=>l.id)) + 1 : 6;
      }
    } catch {}
    return 6;
  });
  const [view, setView] = useState("leads");
  const [selectedLead, setSelectedLead] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [aiSheet, setAiSheet] = useState(null);
  const [filterStage, setFilterStage] = useState("All");
  const [nextId, setNextId] = useState(nextIdInit);
  const [newLead, setNewLead] = useState({name:"",contact:"",type:"B2B",value:"",stage:"Pending",source:"",notes:""});
  const [pdfSheet, setPdfSheet] = useState(false);
  const [pdfParsing, setPdfParsing] = useState(false);
  const [pdfPreview, setPdfPreview] = useState(null);
  const [pdfError, setPdfError] = useState("");
  const [editSheet, setEditSheet] = useState(null); // lead being edited
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const fileRef = useRef();

  const totalClosed = leads.filter(l=>l.stage==="Closed Won").reduce((s,l)=>s+l.value,0);
  const totalPipeline = leads.filter(l=>l.stage==="Pending").reduce((s,l)=>s+l.value,0);
  const hotCount = leads.filter(l=>l.stage==="Pending").length;
  const filtered = leads.filter(l=>filterStage==="All"||l.stage===filterStage);

  const addLead = (data=newLead) => {
    if (!data.name||!data.contact) return;
    const score = data.stage==="Closed Won"?100:data.stage==="Pending"?60:20;
    setLeads(p=>[...p,{...data,id:nextId,value:parseFloat(data.value)||0,score,lastContact:new Date().toISOString().split("T")[0]}]);
    setNextId(n=>n+1);
    setNewLead({name:"",contact:"",type:"B2B",value:"",stage:"Pending",source:"",notes:""});
    setShowAdd(false); setPdfSheet(false); setPdfPreview(null);
  };

  const saveLead = (data) => {
    const score = data.stage==="Closed Won"?100:data.stage==="Pending"?60:20;
    setLeads(p=>p.map(l=>l.id===data.id?{...data,value:parseFloat(data.value)||0,score}:l));
    setEditSheet(null);
    setSelectedLead(null);
  };

  const deleteLead = (id) => {
    setLeads(p=>p.filter(l=>l.id!==id));
    setShowDeleteConfirm(false);
    setSelectedLead(null);
  };

  const callAI = async (lead, type) => {
    setAiSheet({lead,type,result:"",loading:true});
    const prompts = {
      followup:`You are a sharp sales assistant for Valordek, a vinyl decking manufacturer. Write a concise, personalized follow-up ${lead.type==="B2B"?"email":"message"} for this lead:\n\nName: ${lead.name}\nContact: ${lead.contact}\nType: ${lead.type}\nDeal Value: $${lead.value.toLocaleString()}\nStage: ${lead.stage}\nDays since last contact: ${ds(lead.lastContact)}\nNotes: ${lead.notes}\n\nWarm but professional. Under 150 words. No generic openers.`,
      score:`Sales analyst for Valordek. Explain in 3-4 bullet points why this lead scores ${lead.score}/100, and give one specific next action. Max 120 words.\n\nName: ${lead.name}\nType: ${lead.type}\nValue: $${lead.value.toLocaleString()}\nStage: ${lead.stage}\nSource: ${lead.source}\nDays since contact: ${ds(lead.lastContact)}\nNotes: ${lead.notes}`,
      strategy:`Senior sales strategist for Valordek vinyl decking (B2B and B2C). In 3-4 sentences, give a specific strategy to close this deal. Be concrete.\n\nName: ${lead.name}\nType: ${lead.type}\nValue: $${lead.value.toLocaleString()}\nStage: ${lead.stage}\nNotes: ${lead.notes}`,
    };
    try {
      const res = await fetch("/.netlify/functions/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"user",content:prompts[type]}]})});
      const data = await res.json();
      setAiSheet(p=>({...p,result:data.content?.map(b=>b.text||"").join("")||"No response.",loading:false}));
    } catch(e) { setAiSheet(p=>({...p,result:"Failed: "+e.message,loading:false})); }

  const processPDF = async (file) => {
    if (!file||file.type!=="application/pdf"){setPdfError("Please select a PDF.");return;}
    setPdfError(""); setPdfParsing(true); setPdfPreview(null);
    try {
      const base64 = await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const response = await fetch("/.netlify/functions/claude",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:[{role:"user",content:[
          {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},
          {type:"text",text:"This is a QuickBooks estimate PDF. Return ONLY a raw JSON object with no markdown, no explanation, nothing else:\n{\"name\":\"company or client name\",\"contact\":\"contact person full name (use company name if no person)\",\"value\":0,\"type\":\"B2B or B2C\",\"source\":\"QuickBooks Estimate\",\"stage\":\"Pending\",\"notes\":\"brief summary under 80 words\"}\nvalue must be a plain number. B2B if business, B2C if individual."}
        ]}]})
      });
      if (!response.ok) {
        const t = await response.text();
        throw new Error("HTTP "+response.status+": "+t.slice(0,120));
      }
      const data = await response.json();
      if (data.error) throw new Error(typeof data.error === "object" ? JSON.stringify(data.error) : data.error);
      const raw = (data.content||[]).map(b=>b.text||"").join("").trim().replace(/```json|```/g,"").trim();
      if (!raw) throw new Error("Empty AI response");
      const parsed = JSON.parse(raw);
      if (!parsed.name) throw new Error("Could not find client name in PDF.");
      setPdfPreview(parsed);
    } catch(e) { setPdfError("Could not read estimate: "+e.message); }
    finally { setPdfParsing(false); }
  };

    // Save to localStorage whenever leads change

  if (typeof window !== "undefined") {

            {[{l:"Value",v:`$${selectedLead.value.toLocaleString()}`},{l:"Stage",v:selectedLead.stage},{l:"Contact",v:`${ds(selectedLead.lastContact)}d ago`}].map(s=>(

                  <div><label style={lbl}>Stage</label><select value={pdfPreview.stage||"Pending"} onChange={e=>setPdfPreview(p=>({...p,stage:e.target.value}))} style={inp}>{STAGES.map(s=><option key={s}>{s}</option>)}</select></div>
                </div>
                <div><label style={lbl}>Notes (from estimate)</label><textarea value={pdfPreview.notes||""} onChange={e=>setPdfPreview(p=>({...p,notes:e.target.value}))} style={{...inp,height:80,resize:"none"}}/></div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:10}}>
                <button className="tap-btn" onClick={()=>{setPdfPreview(null);setPdfError("");}} style={{background:"#1A1D27",border:"none",color:"#6B7280",padding:14,borderRadius:12,cursor:"pointer",fontWeight:600}}>← Back</button>
                <button className="tap-btn" onClick={()=>addLead(pdfPreview)} style={{background:"linear-gradient(135deg,#10B981,#3B82F6)",border:"none",color:"#fff",padding:14,borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:14}}>✓ Add to Pipeline</button>
              </div>
            </div>
          )}
        </Sheet>
      )}

      {/* EDIT LEAD SHEET */}
      {editSheet&&(
        <Sheet title="Edit Lead" onClose={()=>setEditSheet(null)}>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {[{label:"Company / Name",key:"name",placeholder:"Acme Homes"},{label:"Contact Person",key:"contact",placeholder:"Jane Smith"},{label:"Deal Value ($)",key:"value",placeholder:"5000"},{label:"Lead Source",key:"source",placeholder:"Referral, Website..."}].map(f=>(
              <div key={f.key}><label style={lbl}>{f.label}</label><input value={editSheet[f.key]||""} onChange={e=>setEditSheet(p=>({...p,[f.key]:e.target.value}))} placeholder={f.placeholder} style={inp}/></div>
            ))}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div><label style={lbl}>Type</label><select value={editSheet.type} onChange={e=>setEditSheet(p=>({...p,type:e.target.value}))} style={inp}><option>B2B</option><option>B2C</option></select></div>
              <div><label style={lbl}>Stage</label><select value={editSheet.stage} onChange={e=>setEditSheet(p=>({...p,stage:e.target.value}))} style={inp}>{STAGES.map(s=><option key={s}>{s}</option>)}</select></div>
            </div>
            <div><label style={lbl}>Notes</label><textarea value={editSheet.notes||""} onChange={e=>setEditSheet(p=>({...p,notes:e.target.value}))} placeholder="Notes..." style={{...inp,height:100,resize:"none"}}/></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:10,marginTop:4}}>
              <button className="tap-btn" onClick={()=>setEditSheet(null)} style={{background:"#1A1D27",border:"none",color:"#6B7280",padding:14,borderRadius:12,cursor:"pointer",fontWeight:600}}>Cancel</button>
              <button className="tap-btn" onClick={()=>saveLead(editSheet)} style={{background:"linear-gradient(135deg,#3B82F6,#8B5CF6)",border:"none",color:"#fff",padding:14,borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:14}}>Save Changes ✓</button>
            </div>
          </div>
        </Sheet>
      )}

      {/* AI RESULT SHEET */}
      {aiSheet&&(
        <Sheet title={aiSheet.type==="followup"?"✉ Follow-up Draft":aiSheet.type==="score"?"◎ Score Breakdown":"⚡ Close Strategy"} onClose={()=>setAiSheet(null)}>
          <div style={{fontSize:12,color:"#6B7280",marginBottom:16}}>for {aiSheet.lead.name}</div>
          {aiSheet.loading?(
            <div style={{textAlign:"center",padding:"50px 20px"}}>
              <div style={{fontSize:32,display:"inline-block",animation:"spin 1s linear infinite",marginBottom:12}}>◌</div>
              <div style={{color:"#6B7280",fontSize:14}}>Generating AI response...</div>
            </div>
          ):(
            <div>
              <div style={{background:"#1A1D27",borderRadius:12,padding:18,fontSize:14,lineHeight:1.8,color:"#D1D5DB",whiteSpace:"pre-wrap",marginBottom:14}}>{aiSheet.result}</div>
              <button className="tap-btn" onClick={()=>navigator.clipboard?.writeText(aiSheet.result)} style={{width:"100%",background:"#1A1D27",border:"1px solid #2A2D3A",color:"#9CA3AF",padding:14,borderRadius:12,cursor:"pointer",fontSize:14,fontWeight:600}}>⎘ Copy to Clipboard</button>
            </div>
          )}
        </Sheet>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
